_schema-version: "3.3"
ID: retcl
version: 1.0.0
description: "Rental Equipment Tracking Cloud Application"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # ============================================================
  # CAP SERVICE
  # ============================================================
  - name: retcl-srv
    type: nodejs
    path: gen/srv

    parameters:
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: retcl-auth
      - name: retcl-db


  # ============================================================
  # HANA DATABASE DEPLOYER
  # ============================================================
  - name: retcl-db-deployer
    type: hdb
    path: gen/db

    parameters:
      memory: 256M
      disk-quota: 512M

    requires:
      - name: retcl-db


resources:

  # ============================================================
  # XSUAA
  # ============================================================
  - name: retcl-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json


  # ============================================================
  # HANA HDI CONTAINER
  # ============================================================
  - name: retcl-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

      