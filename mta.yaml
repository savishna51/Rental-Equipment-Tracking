_schema-version: "3.3"
ID: retcl
version: 1.0.0
description: "Rental Equipment Tracking Cloud Application"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - rm -rf app/router/public
        - mkdir -p app/router/public
        - cp -r app/retcldashboard/webapp/. app/router/public/
        - cp -r app/fleet/webapp app/router/public/fleet
        - cp -r app/inspections/webapp app/router/public/inspections
        - cp -r app/billing/webapp app/router/public/com.retcl.billing.billing
        - cp -r app/maintenance/webapp app/router/public/com.retcl.maintenance.maintenance
        - cp -r app/customers/webapp app/router/public/com.retcl.customers.customers
        - cp -r app/rentals/webapp app/router/public/com.retcl.rentals.rentals

modules:

  - name: retcl-router
    type: approuter.nodejs
    path: app/router

    parameters:
      memory: 128M
      disk-quota: 256M

    requires:
      - name: retcl-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
  # ============================================================
  # CAP SERVICE
  # ============================================================
  - name: retcl-srv
    type: nodejs
    path: gen/srv

    parameters:
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: retcl-auth
      - name: retcl-db


  # ============================================================
  # HANA DATABASE DEPLOYER
  # ============================================================
  - name: retcl-db-deployer
    type: hdb
    path: gen/db

    parameters:
      memory: 256M
      disk-quota: 512M

    requires:
      - name: retcl-db


resources:

  # ============================================================
  # XSUAA
  # ============================================================
  - name: retcl-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json


  # ============================================================
  # HANA HDI CONTAINER
  # ============================================================
  - name: retcl-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

      